[phases.setup]
nixPkgs = ["nodejs_20", "chromium"]

[phases.install]
cmds = [
  "npm install"
]

[phases.build]
cmds = [
  "echo 'Finding Chromium path...'",
  "which chromium || echo 'Chromium not found in PATH'"
]

[start]
cmd = "node src/server.js"

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
